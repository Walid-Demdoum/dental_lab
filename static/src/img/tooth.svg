<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Fills for Top Surfaces -->
  <!-- Top North-Left -->
  <path d="M 100,20 L 100,50 L 70,35 Z" fill="#F7DACF" />
  <!-- Top North-Right -->
  <path d="M 100,20 L 130,35 L 100,50 Z" fill="#FFFFFF" />
  <!-- Top West -->
  <path d="M 70,35 L 100,50 L 70,65 L 40,50 Z" fill="#F7DACF" />
  <!-- Top East -->
  <path d="M 100,50 L 130,35 L 160,50 L 130,65 Z" fill="#FFFFFF" />
  
  <!-- Fills for Outer and Inner Vertical Surfaces -->
  <!-- Left Outer Face -->
  <path d="M 40,50 L 70,65 L 70,105 L 100,120 L 100,175 C 90,175 85,160 82,145 C 80,135 70,135 68,145 C 65,165 40,175 40,140 Z" fill="#F7DACF" />
  <!-- Inner Back-Right Wall (Facing Left) -->
  <path d="M 100,50 L 130,65 L 130,105 L 100,90 Z" fill="#F7DACF" />
  
  <!-- Right Outer Face -->
  <path d="M 100,120 L 130,105 L 130,65 L 160,50 L 160,140 C 160,175 135,165 132,145 C 130,135 120,135 118,145 C 115,160 110,175 100,175 Z" fill="#FFFFFF" />
  <!-- Inner Back-Left Wall (Facing Right) -->
  <path d="M 100,50 L 70,65 L 70,105 L 100,90 Z" fill="#FFFFFF" />
  
  <!-- Fill for Cutout Floor -->
  <path d="M 100,90 L 70,105 L 100,120 L 130,105 Z" fill="#C4DDF2" />

  <!-- Master Stroke Path for all Outlines and Facets -->
  <path d="
    M 100,20 L 130,35 L 160,50 L 160,140 C 160,175 135,165 132,145 C 130,135 120,135 118,145 C 115,160 110,175 100,175 C 90,175 85,160 82,145 C 80,135 70,135 68,145 C 65,165 40,175 40,140 L 40,50 L 70,35 Z
    M 100,20 L 100,50
    M 70,35 L 100,50 L 130,35
    M 40,50 L 70,65 L 100,50 L 130,65 L 160,50
    M 70,65 L 70,105 L 100,120 L 130,105 L 130,65
    M 70,105 L 100,90 L 130,105
    M 100,50 L 100,90
    M 100,120 L 100,175
  " fill="none" stroke="#5D7290" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Inner Detail Line on the Cutout Floor -->
  <path d="M 100,96 L 118,105 L 100,114 L 82,105 Z" fill="none" stroke="#5D7290" stroke-width="2.5" stroke-linejoin="round" />
</svg>
